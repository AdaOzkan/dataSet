<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAYFELMUN Digital Badge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Big Shoulders Display eklendi -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Montserrat:wght@500;700;900&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* Özel Font Tanımlamaları */
    @font-face {
      font-family: 'Northwell';
      src: url('northwell.ttf') format('truetype');
    }
    @font-face {
      font-family: 'F1DisplayBlack';
      src: url('F1-Display-Black.ttf') format('truetype'),
           url('F1-Display-Black.woff2') format('woff2');
    }
    @font-face {
      font-family: 'FormulaBold';
      src: url('Formula1-Bold.ttf') format('truetype'),
           url('Formula1-Bold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'FormulaRegular';
      src: url('Formula1-Regular.ttf') format('truetype'),
           url('Formula1-Regular.woff2') format('woff2');
    }
    /* Yeni Eklenen KH Interface Fontu */
    @font-face {
      font-family: 'KHInterface';
      src: url('KH-Interface.ttf') format('truetype');
    }

    /* Font Sınıfları */
    .font-northwell {
      font-family: 'Northwell', 'Caveat', cursive;
    }
    .font-f1-black {
      font-family: 'F1DisplayBlack', 'Montserrat', sans-serif;
      font-weight: 900;
    }
    .font-formula-bold {
      font-family: 'FormulaBold', 'Montserrat', sans-serif;
      font-weight: 800;
    }
    .font-formula-regular {
      font-family: 'FormulaRegular', 'Montserrat', sans-serif;
      font-weight: 500;
    }
    .font-kh-interface {
      font-family: 'KHInterface', monospace;
    }
    .font-big-shoulders {
      font-family: 'Big Shoulders Display', sans-serif;
    }

    .bg-badge-dark {
      background-color: #0c1115;
    }
    .text-mint {
      color: #70dac1;
    }
    .bg-mint {
      background-color: #70dac1;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 font-sans flex flex-col items-center justify-start py-8">

  <!-- FİZİKSEL YAKA KARTI TASARIMI -->
  <div id="badge-card" class="relative w-full max-w-[380px] bg-badge-dark border border-slate-800 rounded-3xl shadow-2xl overflow-hidden p-6 flex flex-col justify-between min-h-[640px] text-center my-4">
    
    <!-- Arka Plan Filigran Logosu (%36 Şeffaflık) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
      <img src="rayfelmunLogo.png" alt="RAYFELMUN Logo" class="w-80 h-auto opacity-[0.36] object-contain" onerror="this.style.display='none'">
    </div>

    <!-- Üst Geometrik Mint Çizgiler (50 Derece Açı) -->
    <div class="relative z-10 w-full mb-2">
      <div class="flex flex-col gap-1.5 items-center">
        <!-- -skew-x-[50deg] ile açılar tam 50 dereceye ayarlandı -->
        <div class="w-full h-3.5 bg-mint rounded-sm -skew-x-[50deg]"></div>
        <div class="w-4/5 h-2.5 bg-mint rounded-sm -skew-x-[50deg] opacity-80"></div>
      </div>
    </div>

    <!-- Kart İçerik Alanı -->
    <div class="relative z-10 flex-1 flex flex-col justify-center items-center space-y-2 py-4">
      
      <!-- Ad (Northwell) -->
      <div id="d-firstname" class="font-northwell text-mint text-6xl leading-none tracking-wide pt-2">
        Ada
      </div>

      <!-- Soyad (F1 Display Black) -->
      <div id="d-lastname" class="font-f1-black text-white text-4xl uppercase tracking-wider leading-tight">
        ÖZKAN
      </div>

      <!-- Komite (Formula Bold) -->
      <div id="d-committee" class="font-formula-bold text-mint text-4xl uppercase tracking-wide pt-2">
        LEGAL
      </div>

      <!-- Ülke (Big Shoulders Display) -->
      <div id="d-country" class="font-big-shoulders font-bold text-white text-4xl uppercase tracking-widest pb-1">
        USA
      </div>

      <!-- Okul Bilgisi (Formula Regular) -->
      <div id="d-school" class="font-formula-regular text-mint text-xs uppercase tracking-wider px-2 leading-relaxed pt-2">
        RAMAZAN YAMAN SCIENCE HIGH SCHOOL
      </div>

      <!-- Telefon / İletişim (KH Interface Fontu) -->
      <div id="d-phone" class="font-kh-interface text-white text-sm tracking-widest pt-2">
        +90: 5070107106
      </div>

      <!-- Danışman / İletişim Detayları (KH Interface Fontu) -->
      <div class="font-kh-interface text-[11px] text-slate-300 space-y-0.5 pt-3 tracking-wider opacity-90 uppercase">
        <div>ADVISOR NAME: <span id="advisor-name">XXXX XXXX</span></div>
        <div>ADVISOR NUMBER: <span id="advisor-number">+90 XXX XXX XX XX</span></div>
      </div>

    </div>

    <!-- Alt Geometrik Çizgiler & Cursive Footer (50 Derece Açı) -->
    <div class="relative z-10 w-full mt-2 space-y-2">
      <div class="font-northwell text-white text-3xl tracking-wide">
        Rayfelmun'27
      </div>
      <div class="flex flex-col gap-1.5 items-center">
        <!-- skew-x-[50deg] ile alt çizgiler zıt yönde 50 dereceye ayarlandı -->
        <div class="w-full h-2.5 bg-mint rounded-sm skew-x-[50deg]"></div>
        <div class="w-3/5 h-1.5 bg-mint rounded-sm skew-x-[50deg] opacity-80"></div>
      </div>
    </div>

  </div>

  <!-- GÜVENLİK & CHAIR NOT EKLEME PANELİ (Sistemsel Yapı Değişmedi) -->
  <div class="w-full max-w-[380px] bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-xl mt-2">
    <h3 class="text-xs font-black text-slate-300 uppercase tracking-wider mb-3 flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span> Güvenlik & Chair Paneli
    </h3>
    
    <div class="space-y-3">
      <input id="staff-name" type="text" placeholder="Giriş Yapan Görevli Adı" class="w-full text-xs p-3 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-mint bg-slate-950 text-white placeholder-slate-500">
      <textarea id="note-text" placeholder="İhlal / Not detayını yazın..." class="w-full text-xs p-3 border border-slate-700 rounded-xl h-20 focus:outline-none focus:ring-2 focus:ring-mint bg-slate-950 text-white placeholder-slate-500"></textarea>
      
      <select id="severity" class="w-full text-xs p-3 border border-slate-700 rounded-xl bg-slate-950 text-slate-200 font-semibold focus:outline-none focus:ring-2 focus:ring-mint">
        <option value="Info">Bilgi / Genel Not</option>
        <option value="Yellow">Sarı Kart (Uyarı)</option>
        <option value="Red">Kırmızı Kart (Ağır İhlal)</option>
      </select>

      <button onclick="addNote()" class="w-full bg-mint text-slate-950 font-black py-3 rounded-xl text-xs hover:bg-opacity-90 transition shadow-lg active:scale-95">
        Notu Veritabanına İşle
      </button>
    </div>

    <!-- Geçmiş Notlar -->
    <div class="mt-5">
      <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Sistemdeki Not Geçmişi</h4>
      <ul id="notes-list" class="space-y-2 text-xs"></ul>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const SUPABASE_URL = "https://slxedihzptfjmhxsdhyl.supabase.co";
      const SUPABASE_KEY = "sb_publishable_cXaZS9Eml-wHkF7toWO93A_oGviuKsZ";

      const firstNameEl = document.getElementById('d-firstname');
      const lastNameEl = document.getElementById('d-lastname');
      const commEl = document.getElementById('d-committee');
      const countryEl = document.getElementById('d-country');

      try {
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        window.supabaseClient = client;

        const urlParams = new URLSearchParams(window.location.search);
        const delegateId = urlParams.get('id');

        if (!delegateId) {
          firstNameEl.innerText = "ID";
          lastNameEl.innerText = "EKSİK!";
          lastNameEl.classList.add('text-red-500');
          return;
        }

        const { data: delegate, error } = await client
          .from('delegates')
          .select('*')
          .eq('id', delegateId)
          .maybeSingle();

        if (error || !delegate) {
          firstNameEl.innerText = "Delege";
          lastNameEl.innerText = "BULUNAMADI!";
          lastNameEl.classList.add('text-red-500');
          return;
        }

        if (delegate.full_name) {
          const parts = delegate.full_name.trim().split(' ');
          if (parts.length > 1) {
            lastNameEl.innerText = parts.pop().toUpperCase();
            firstNameEl.innerText = parts.join(' ');
          } else {
            firstNameEl.innerText = delegate.full_name;
            lastNameEl.innerText = '';
          }
        }

        commEl.innerText = delegate.committee || '-';
        countryEl.innerText = delegate.country || '-';

        loadNotes(client, delegateId);

      } catch (err) {
        console.error("Sistem Hatası:", err);
      }
    });

    async function loadNotes(client, delegateId) {
      const { data: notes } = await client
        .from('delegate_notes')
        .select('*')
        .eq('delegate_id', delegateId)
        .order('created_at', { ascending: false });

      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      if (notes && notes.length > 0) {
        notes.forEach(n => {
          const color = n.severity === 'Red' ? 'border-red-500 bg-red-950/30 text-red-200' : n.severity === 'Yellow' ? 'border-yellow-500 bg-yellow-950/30 text-yellow-200' : 'border-slate-700 bg-slate-800/50 text-slate-200';
          list.innerHTML += `
            <li class="p-3 border-l-4 ${color} rounded-xl shadow-sm">
              <div class="font-bold text-xs">${n.logged_by} <span class="text-[9px] opacity-75">(${n.severity})</span></div>
              <div class="mt-0.5 text-xs">${n.note}</div>
            </li>`;
        });
      } else {
        list.innerHTML = '<li class="text-slate-500 italic text-xs">Henüz not eklenmemiş.</li>';
      }
    }

    async function addNote() {
      const client = window.supabaseClient;
      const urlParams = new URLSearchParams(window.location.search);
      const delegateId = urlParams.get('id');

      const staff = document.getElementById('staff-name').value;
      const note = document.getElementById('note-text').value;
      const severity = document.getElementById('severity').value;

      if (!staff || !note) return alert("Lütfen görevli adını ve notu doldurun.");

      const { error } = await client.from('delegate_notes').insert([
        { delegate_id: delegateId, logged_by: staff, note: note, severity: severity }
      ]);

      if (error) {
        alert("Not İşlenemedi: " + error.message);
      } else {
        alert("Not başarıyla veritabanına eklendi!");
        document.getElementById('note-text').value = '';
        loadNotes(client, delegateId);
      }
    }
  </script>
</body>
</html>
