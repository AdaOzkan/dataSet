<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUN Digital Badge</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans max-w-md mx-auto min-h-screen flex flex-col justify-center">

  <!-- Delege Dijital Yaka Kartı -->
  <div id="badge-card" class="bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">
    <div class="bg-slate-900 p-5 text-white text-center relative">
      <h1 class="font-extrabold text-xl tracking-wider text-amber-400">RAYFELMUN '26</h1>
      <p class="text-xs text-slate-300 tracking-widest uppercase mt-1">Resmi Delege Yaka Kartı</p>
    </div>
    
    <div class="p-6 text-center space-y-4">
      <!-- Profil / Baş Harf İkonu -->
      <div id="avatar-box" class="w-20 h-20 bg-slate-900 text-amber-400 font-bold text-2xl rounded-full mx-auto flex items-center justify-center shadow-md border-4 border-slate-100">
        <span id="avatar-initials">--</span>
      </div>

      <!-- İsim Soyisim -->
      <div>
        <h2 id="d-name" class="text-2xl font-black text-slate-800 tracking-tight">Yükleniyor...</h2>
        <p class="text-xs text-slate-400 uppercase tracking-widest mt-0.5">Delege</p>
      </div>

      <!-- Komite & Ülke Bilgileri -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <div class="bg-blue-50 border border-blue-200 p-3 rounded-2xl">
          <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider">Komite</p>
          <p id="d-committee" class="text-base font-extrabold text-blue-900 mt-0.5">-</p>
        </div>
        <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl">
          <p class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider">Ülke / Temsil</p>
          <p id="d-country" class="text-base font-extrabold text-emerald-900 mt-0.5">-</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Güvenlik / Chair Paneli -->
  <div class="mt-6 bg-white p-5 rounded-3xl shadow-xl border border-gray-200">
    <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-red-500"></span> Güvenlik & Chair Paneli
    </h3>
    
    <div class="space-y-3">
      <input id="staff-name" type="text" placeholder="Giriş Yapan Görevli Adı" class="w-full text-sm p-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-slate-900 bg-gray-50">
      <textarea id="note-text" placeholder="İhlal / Not detayını yazın..." class="w-full text-sm p-3 border border-gray-200 rounded-xl h-20 focus:outline-none focus:ring-2 focus:ring-slate-900 bg-gray-50"></textarea>
      
      <select id="severity" class="w-full text-sm p-3 border border-gray-200 rounded-xl bg-gray-50 text-slate-700 font-semibold">
        <option value="Info">Bilgi / Genel Not</option>
        <option value="Yellow">Sarı Kart (Uyarı)</option>
        <option value="Red">Kırmızı Kart (Ağır İhlal)</option>
      </select>

      <button onclick="addNote()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl text-sm hover:bg-slate-800 transition shadow-lg active:scale-95">
        Notu Veritabanına İşle
      </button>
    </div>

    <!-- Geçmiş Notlar -->
    <div class="mt-5">
      <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Sistemdeki Not Geçmişi</h4>
      <ul id="notes-list" class="space-y-2 text-xs"></ul>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://slxedihzptfjmhxsdhyl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cXaZS9Eml-wHkF7toWO93A_oGviuKsZ";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const delegateId = urlParams.get('id');

    async function loadDelegate() {
      if (!delegateId) {
          document.getElementById('d-name').innerText = "Geçersiz Link!";
          alert("Lütfen URL sonunda geçerli bir delege ID'si bulundurun.");
          return;
      }

      const { data: delegate, error } = await supabase
        .from('delegates')
        .select('*')
        .eq('id', delegateId)
        .single();

      if (error || !delegate) {
        document.getElementById('d-name').innerText = "Delege Bulunamadı!";
        document.getElementById('d-name').classList.add('text-red-500');
        alert("HATA: Bu ID veritabanında yok! Lütfen Supabase'den gerçek bir ID kopyalayın.");
        return;
      }

      document.getElementById('d-name').innerText = delegate.full_name;
      document.getElementById('d-committee').innerText = delegate.committee;
      document.getElementById('d-country').innerText = delegate.country;

      // İsim baş harflerinden daire profil ikonu oluştur
      const initials = delegate.full_name ? delegate.full_name.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase() : '??';
      document.getElementById('avatar-initials').innerText = initials;

      loadNotes();
    }

    async function loadNotes() {
      const { data: notes, error } = await supabase
        .from('delegate_notes')
        .select('*')
        .eq('delegate_id', delegateId)
        .order('created_at', { ascending: false });

      if (error) return;

      const list = document.getElementById('notes-list');
      list.innerHTML = '';
      if (notes && notes.length > 0) {
        notes.forEach(n => {
          const color = n.severity === 'Red' ? 'border-red-500 bg-red-50 text-red-900' : n.severity === 'Yellow' ? 'border-yellow-500 bg-yellow-50 text-yellow-900' : 'border-gray-300 bg-gray-50 text-gray-800';
          list.innerHTML += `
            <li class="p-3 border-l-4 ${color} rounded-xl shadow-sm">
              <div class="font-bold">${n.logged_by} <span class="text-[10px] opacity-75">(${n.severity})</span></div>
              <div class="mt-0.5">${n.note}</div>
            </li>`;
        });
      } else {
        list.innerHTML = '<li class="text-gray-400 italic">Henüz not eklenmemiş.</li>';
      }
    }

    async function addNote() {
      const staff = document.getElementById('staff-name').value;
      const note = document.getElementById('note-text').value;
      const severity = document.getElementById('severity').value;

      if (!staff || !note) return alert("Lütfen görevli adını ve notu doldurun.");

      const { error } = await supabase.from('delegate_notes').insert([
        { delegate_id: delegateId, logged_by: staff, note: note, severity: severity }
      ]);

      if (error) {
        alert("Not İşlenemedi! Sebep: " + error.message);
      } else {
        alert("Not veritabanına başarıyla eklendi!");
        document.getElementById('note-text').value = '';
        loadNotes();
      }
    }

    loadDelegate();
  </script>
</body>
</html>
