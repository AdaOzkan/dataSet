<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUN Secretariat Live Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Northwell';
      src: url('northwell.ttf') format('truetype');
    }
    .font-northwell {
      font-family: 'Northwell', 'Caveat', cursive;
    }
    body {
      background-color: #0c1115;
      color: #f1f5f9;
    }
  </style>
</head>
<body class="relative min-h-screen font-sans p-4 md:p-8 overflow-x-hidden flex flex-col justify-between">

  <!-- Top Decorative Lines (Pass.svg Pattern) -->
  <div class="absolute top-0 left-0 w-full flex justify-center items-start pointer-events-none z-0 overflow-hidden opacity-90">
    <img src="Pass.svg" alt="Top Pass" class="w-[35%] flex-shrink-0 object-contain">
    <img src="Pass.svg" alt="Top Pass" class="w-[35%] flex-shrink-0 object-contain -ml-[5.5%]">
    <img src="Pass.svg" alt="Top Pass" class="w-[35%] flex-shrink-0 object-contain -ml-[5.5%]">
    <img src="Pass.svg" alt="Top Pass" class="w-[35%] flex-shrink-0 object-contain -ml-[5.5%]">
  </div>

  <div class="relative z-10 max-w-6xl mx-auto w-full space-y-6 my-auto py-6">
    
    <!-- Top Header & Status Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#0c1115] border border-[#8e8cbd]/30 p-6 rounded-3xl shadow-2xl">
      <div>
        <h1 class="text-2xl md:text-3xl font-black tracking-tight" style="color: #e6f854;">RAYFELMUN '27</h1>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="fetchNotes()" class="flex items-center gap-2 bg-[#0c1115] hover:bg-[#8e8cbd]/20 text-xs font-semibold px-4 py-2.5 rounded-xl border border-[#8e8cbd]/40 transition active:scale-95" style="color: #79dab3;">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
          <span>Refresh</span>
        </button>
        <div id="status-badge" class="flex items-center gap-2 text-xs font-bold px-4 py-2.5 rounded-xl border" style="background-color: rgba(1, 192, 14, 0.1); border-color: rgba(1, 192, 14, 0.3); color: #01c00e;">
          <span class="w-2 h-2 rounded-full animate-pulse" style="background-color: #01c00e;"></span>
          <span>Live Connection Active</span>
        </div>
      </div>
    </div>

    <!-- Overview Statistics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-[#0c1115] border border-[#8e8cbd]/30 p-5 rounded-2xl shadow-lg">
        <div class="flex items-center justify-between">
          <p class="text-xs font-bold uppercase tracking-wider" style="color: #8e8cbd;">Total Logs</p>
          <svg class="w-4 h-4 opacity-70" style="color: #8e8cbd;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <p id="stat-total" class="text-3xl font-black text-white mt-1">0</p>
      </div>

      <div class="bg-[#0c1115] p-5 rounded-2xl shadow-lg border" style="border-color: rgba(255, 208, 0, 0.3);">
        <div class="flex items-center justify-between">
          <p class="text-xs font-bold uppercase tracking-wider" style="color: #ffd000;">1st Warning</p>
          <svg class="w-4 h-4" style="color: #ffd000;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <p id="stat-w1" class="text-3xl font-black mt-1" style="color: #ffd000;">0</p>
      </div>

      <div class="bg-[#0c1115] p-5 rounded-2xl shadow-lg border" style="border-color: rgba(255, 128, 0, 0.3);">
        <div class="flex items-center justify-between">
          <p class="text-xs font-bold uppercase tracking-wider" style="color: #ff8000;">2nd Warning</p>
          <svg class="w-4 h-4" style="color: #ff8000;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <p id="stat-w2" class="text-3xl font-black mt-1" style="color: #ff8000;">0</p>
      </div>

      <div class="bg-[#0c1115] p-5 rounded-2xl shadow-lg border" style="border-color: rgba(232, 0, 45, 0.3);">
        <div class="flex items-center justify-between">
          <p class="text-xs font-bold uppercase tracking-wider" style="color: #e8002d;">3rd Warning</p>
          <svg class="w-4 h-4" style="color: #e8002d;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path></svg>
        </div>
        <p id="stat-w3" class="text-3xl font-black mt-1" style="color: #e8002d;">0</p>
      </div>
    </div>

    <!-- Live Notes Table -->
    <div class="bg-[#0c1115] border border-[#8e8cbd]/30 rounded-3xl overflow-hidden shadow-2xl">
      <div class="p-5 border-b border-[#8e8cbd]/20 flex justify-between items-center">
        <h2 class="text-sm font-extrabold uppercase tracking-wider flex items-center gap-2" style="color: #79dab3;">
          <span class="w-2.5 h-2.5 rounded-full animate-ping" style="background-color: #79dab3;"></span> Live Incoming Notes
        </h2>
        <span class="text-xs" style="color: #606066;">Auto-synchronized every 5 seconds</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-black/40 text-[11px] uppercase tracking-wider border-b border-[#8e8cbd]/20" style="color: #8e8cbd;">
              <th class="p-4">Time</th>
              <th class="p-4">Delegate Name</th>
              <th class="p-4">Committee / Country</th>
              <th class="p-4">Logged By</th>
              <th class="p-4">Note Details</th>
              <th class="p-4">Status</th>
            </tr>
          </thead>
          <tbody id="notes-table-body" class="divide-y divide-[#8e8cbd]/10 text-xs">
            <tr>
              <td colspan="6" class="p-8 text-center italic" style="color: #606066;">Loading data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Bottom Oversized, Centered Decorative Section with Text Overlaid in the Middle -->
  <div class="relative z-10 w-full mt-12 py-8 flex items-center justify-center pointer-events-none opacity-90 overflow-hidden">
    <div class="absolute left-1/2 -translate-x-1/2 w-[250%] md:w-[220%] flex justify-center z-0">
      <img src="Pass (1).svg" alt="Bottom Pass" class="w-full h-auto object-contain">
    </div>
    <div class="relative z-10 font-northwell text-white text-4xl md:text-5xl tracking-wide text-center drop-shadow-lg">
      Rayfelmun'27
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://slxedihzptfjmhxsdhyl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_cXaZS9Eml-wHkF7toWO93A_oGviuKsZ";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchNotes() {
      try {
        const { data: notes, error } = await supabaseClient
          .from('delegate_notes')
          .select(`
            id,
            logged_by,
            note,
            severity,
            created_at,
            delegates ( full_name, committee, country )
          `)
          .order('created_at', { ascending: false });

        if (error) {
          console.error("Failed to fetch notes:", error);
          return;
        }

        renderTable(notes || []);
      } catch (err) {
        console.error("System error:", err);
      }
    }

    function renderTable(notes) {
      const tbody = document.getElementById('notes-table-body');
      
      let w1Count = 0;
      let w2Count = 0;
      let w3Count = 0;

      if (notes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center italic" style="color: #606066;">No recorded notes found in the system.</td></tr>`;
        updateStats(0, 0, 0, 0);
        return;
      }

      tbody.innerHTML = notes.map(n => {
        let badgeStyle = 'background-color: rgba(142, 140, 189, 0.1); color: #8e8cbd; border-color: rgba(142, 140, 189, 0.3);';
        let badgeText = 'Info';

        if (n.severity === 'Info' || n.severity === '1st Warning' || n.severity === '1. Uyarı') {
          w1Count++;
          badgeStyle = 'background-color: rgba(255, 208, 0, 0.1); color: #ffd000; border-color: rgba(255, 208, 0, 0.3);';
          badgeText = '1st Warning';
        } else if (n.severity === 'Yellow' || n.severity === '2nd Warning' || n.severity === '2. Uyarı') {
          w2Count++;
          badgeStyle = 'background-color: rgba(255, 128, 0, 0.1); color: #ff8000; border-color: rgba(255, 128, 0, 0.3);';
          badgeText = '2nd Warning';
        } else if (n.severity === 'Red' || n.severity === '3rd Warning' || n.severity === '3. Uyarı') {
          w3Count++;
          badgeStyle = 'background-color: rgba(232, 0, 45, 0.1); color: #e8002d; border-color: rgba(232, 0, 45, 0.3);';
          badgeText = '3rd Warning';
        }

        const timeStr = new Date(n.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        const delegateName = n.delegates ? n.delegates.full_name : '<span style="color: #e8002d;">Deleted Delegate</span>';
        const committee = n.delegates ? `${n.delegates.committee} / ${n.delegates.country}` : '-';

        return `
          <tr class="hover:bg-[#8e8cbd]/10 transition">
            <td class="p-4 font-mono" style="color: #8e8cbd;">${timeStr}</td>
            <td class="p-4 font-bold text-white">${delegateName}</td>
            <td class="p-4 text-slate-300"><span class="px-2 py-1 rounded-md border border-[#8e8cbd]/30 bg-black/30">${committee}</span></td>
            <td class="p-4 text-slate-300 font-medium">${n.logged_by}</td>
            <td class="p-4 text-slate-200 max-w-xs break-words">${n.note}</td>
            <td class="p-4">
              <span class="inline-block px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase border" style="${badgeStyle}">
                ${badgeText}
              </span>
            </td>
          </tr>
        `;
      }).join('');

      updateStats(notes.length, w1Count, w2Count, w3Count);
    }

    function updateStats(total, w1, w2, w3) {
      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-w1').innerText = w1;
      document.getElementById('stat-w2').innerText = w2;
      document.getElementById('stat-w3').innerText = w3;
    }

    function subscribeRealtime() {
      supabaseClient
        .channel('public:delegate_notes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'delegate_notes' }, payload => {
          fetchNotes();
        })
        .subscribe();
    }

    fetchNotes();
    subscribeRealtime();
    setInterval(fetchNotes, 5000);
  </script>

</body>
</html>
